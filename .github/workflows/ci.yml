name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Lint is reported but does not fail the build: the tree carries 21
      # pre-existing errors from React-compiler-era rules. Make it blocking the
      # day that baseline reaches zero, not before — a check that is always red
      # is a check nobody reads.
      - run: npm run lint
        continue-on-error: true
